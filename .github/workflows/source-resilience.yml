name: Verify source resilience patch
on:
  push:
    branches: ['cloud/fix-source-resilience-20261111']
    paths: ['.github/workflows/source-resilience.yml', 'current/**', 'app/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Source parser checks
        run: |
          python -m pip install Pillow
          python tools/run_checks.py
      - name: Compile and test unsigned Stable without release publication
        run: gradle -PaudiobookChannel=stable :app:testDebugUnitTest :app:testReleaseUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:lintRelease --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-resilience-reports
          path: |
            app/build/test-results/
            app/build/reports/
