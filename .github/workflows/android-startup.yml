name: Diagnose released startup on Android 35
on:
  push:
    branches: [diagnostics/startup-35]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact reported APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download preview-v100010 --repo "$GITHUB_REPOSITORY" --pattern Audiobook-Preview.apk --dir baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce startup on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 300
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/probe-startup.sh baseline/Audiobook-Preview.apk
      - name: Save startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-36-startup-evidence
          path: startup-evidence/
