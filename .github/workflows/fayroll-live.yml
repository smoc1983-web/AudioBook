name: Fayroll live source and chapter QA
on:
  push:
    branches: ['qa/fayroll-live-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_RUN_NUMBER_OVERRIDE: '124'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: JVM regressions and imported legacy title cases
        run: GITHUB_RUN_NUMBER=124 gradle :app:testDebugUnitTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: Build instrumented QA APK
        run: GITHUB_RUN_NUMBER=124 gradle :app:assembleDebug :app:assembleDebugAndroidTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          script: |
            result=0; GITHUB_RUN_NUMBER=124 gradle :app:connectedDebugAndroidTest -PaudiobookChannel=test -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.FayrollLiveTest --max-workers=2 || result=$?; adb logcat -d -s FayrollQA:I '*:S'; exit "$result"
