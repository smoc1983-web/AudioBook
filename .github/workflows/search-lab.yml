name: Audiobook Test APK
on:
  push:
    branches: ['cloud/search-download-lab-20261123']
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Exercise source parser fixtures
        run: |
          python3 current/check.py
          node current/tests/test-additional-sources.cjs
          node current/tests/test-nova-sources.cjs
          node current/tests/test-top-downloads.cjs
          node current/test-online-source.cjs
      - name: Test and build only the test application
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug -PaudiobookChannel=searchlab --continue --stacktrace
      - name: Verify distinct package and isolate installable APK
        run: |
          mkdir -p test-output
          cp app/build/outputs/apk/debug/app-debug.apk test-output/Audiobook-Test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging test-output/Audiobook-Test.apk > test-output/apk-info.txt
          grep -F "package: name='com.audiobookdownloader.searchlab'" test-output/apk-info.txt
          grep -F "application-label:'Audiobook Test'" test-output/apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs test-output/Audiobook-Test.apk
          (cd test-output && sha256sum Audiobook-Test.apk | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Test
          path: test-output/
          if-no-files-found: error
