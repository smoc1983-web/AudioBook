name: Audiobook Search Test APK
on:
  push:
    branches: ['cloud/search-reliability-test-20261123']
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Exercise source parser fixtures
        run: |
          python3 current/check.py
          node current/tests/test-additional-sources.cjs
          node current/tests/test-nova-sources.cjs
          node current/tests/test-top-downloads.cjs
          node current/test-online-source.cjs
      - name: Test and build only the test application
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PaudiobookChannel=searchlab --max-workers=2 --console=plain
          python3 scripts/check-android-lint.py app/build/reports/lint-results-debug.xml
      - name: Enable the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Telegram and download controls in the test package
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: gradle :app:connectedDebugAndroidTest -PaudiobookChannel=searchlab -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.SearchLabSmokeTest,com.audiobookdownloader.SearchLabReliabilityTest --max-workers=2 --console=plain
      - name: Verify distinct package and isolate installable APK
        run: |
          mkdir -p test-output
          cp app/build/outputs/apk/debug/app-debug.apk test-output/Audiobook-Search-Test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging test-output/Audiobook-Search-Test.apk > test-output/apk-info.txt
          grep -F "package: name='com.audiobookdownloader.searchfixes'" test-output/apk-info.txt
          grep -F "application-label:'Audiobook Test — Поиск'" test-output/apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs test-output/Audiobook-Search-Test.apk
          (cd test-output && sha256sum Audiobook-Search-Test.apk | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Search-Test
          path: test-output/
          if-no-files-found: error
