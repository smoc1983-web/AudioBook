name: Verify and package Audiobook Preview 4.2.100
on:
  push:
    branches: ['cloud/publish100-20261122']
    paths: ['.github/workflows/preview100-candidate.yml', 'current/**', 'app/**']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREVIEW_CANDIDATE_NUMBER: '100'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Restore the original Preview signing identity
        env:
          ORIGINAL_KEY: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'audiobook-preview-signing/preview.keystore'
          if os.environ.get('ORIGINAL_KEY'):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(os.environ['ORIGINAL_KEY'], validate=True))
              path.chmod(0o600)
          if not path.is_file() or not path.stat().st_size:
              raise SystemExit('Original Preview signer unavailable')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PREVIEW_KEYSTORE={path}\n')
          PY
      - name: Fetch the published upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/preview-v100100; then
            echo 'Preview 4.2.100 is already tagged.' >&2
            exit 1
          else
            test "$?" -eq 2
          fi
          GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/fetch-upgrade-baseline.py
          python3 -c "import json; assert json.load(open('upgrade-baseline/preview-update.json'))['versionCode'] == 100099"
      - name: App builds, JVM tests and Android lint
        run: |
          GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease :app:auditRuntimeDependencies :upgradeProbe:assembleDebug --max-workers=2 --console=plain
          python3 scripts/check-android-lint.py app/build/reports/lint-results-release.xml
      - name: Enable emulator access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check listening features, player and upgrade from Preview 4.2.99
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.CompactPlayerTest,com.audiobookdownloader.NovaListeningFeaturesTest,com.audiobookdownloader.BookProgressWidgetTest --max-workers=2 --console=plain
            GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/test-preview-upgrade.py
      - name: Verify the signed APK and build updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/preview-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Preview-4.2.100-candidate
          path: |
            dist/Audiobook-Preview.apk
            dist/preview-update.json
            dist/permission-audit.json
            startup-evidence/installed-upgrade.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview100-verification
          path: |
            app/build/test-results/
            app/build/reports/
            app/build/outputs/androidTest-results/
            startup-evidence/*.txt
