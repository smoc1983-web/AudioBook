name: AudioBook QA - unit, emulator and promote Test
on:
  push:
    branches: ['feature/test-diagnostic-vpn-reports-20261123', 'feature/test-search-diagnostics-20261123']
  pull_request:
    branches: ['test']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-audiobook-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Check source parsers
        run: |
          python3 current/check.py
          node current/tests/test-additional-sources.cjs
          node current/tests/test-nova-sources.cjs
      - name: Android unit tests, compile and lint
        run: |
          GITHUB_RUN_NUMBER=104 gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease -PaudiobookChannel=test --max-workers=2 --console=plain
          python3 scripts/check-android-lint.py app/build/reports/lint-results-release.xml
      - name: Compare unsigned Test release sizes for the Activity refactor
        if: github.head_ref == 'refactor/bookinfo-scripts-20261125'
        run: |
          git fetch --depth=1 origin 98a1a98df229c2f2f32f1b0676f20363c8f0102c
          baseline="$RUNNER_TEMP/audiobook-before"
          git worktree add --detach "$baseline" FETCH_HEAD
          GITHUB_RUN_NUMBER=104 gradle -p "$baseline" :app:assembleRelease -PaudiobookChannel=test --max-workers=2 --console=plain
          python3 - "$baseline" <<'PYTHON'
          import pathlib, sys
          for label, root in (("before", pathlib.Path(sys.argv[1])), ("after", pathlib.Path.cwd())):
              apk, = (root/"app/build/outputs/apk/release").glob("*.apk")
              print(f"APK_BYTES {label} {apk.stat().st_size}")
          PYTHON
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-test-diagnostics-checks
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
  emulator:
    name: Android 36 emulator regression
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual UI and regression tests in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            GITHUB_RUN_NUMBER=104 gradle :app:connectedDebugAndroidTest -PaudiobookChannel=test -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.CycleSubscriptionsNavigationTest,com.audiobookdownloader.CollectionTransferTest,com.audiobookdownloader.NovaListeningFeaturesTest,com.audiobookdownloader.SearchScrollTest,com.audiobookdownloader.SearchFiltersTest,com.audiobookdownloader.RankedAudioSearchTest,com.audiobookdownloader.UpdateScreenTest,com.audiobookdownloader.LatestMenuRegressionTest,com.audiobookdownloader.LibraryExperienceTest,com.audiobookdownloader.OfficialSeriesTest,com.audiobookdownloader.EditionDownloadTest,com.audiobookdownloader.MiniPlayerSwipeTest,com.audiobookdownloader.SearchConcurrencyAndroidTest --max-workers=2 --console=plain
      - name: Refactor regressions and download recovery across emulator reboot
        if: github.head_ref == 'refactor/bookinfo-scripts-20261125'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            GITHUB_RUN_NUMBER=104 gradle :app:connectedDebugAndroidTest -PaudiobookChannel=test -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.AbSearchInputTest,com.audiobookdownloader.BookmarkUiTest,com.audiobookdownloader.IdlePlaybackTest,com.audiobookdownloader.DiagnosticPrivacyAndroidTest,com.audiobookdownloader.WebViewIsolationTest,com.audiobookdownloader.DownloadQueueStoreTest,com.audiobookdownloader.DurableQueueTest --max-workers=2 --console=plain
            bash tools/tests/queue-process-check.sh com.audiobookdownloader.test
      - name: Upload emulator evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-test-emulator-reports
          path: |
            app/build/reports/stage3-process/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14

  promote:
    name: Promote validated QA to Test and start signed release
    needs: [checks, emulator]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'test' && startsWith(github.event.pull_request.head.ref, 'qa/') && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Guard branch and exact SHA, merge only into test
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          test "$(gh api "$PR" --jq '.state')" = "open"
          test "$(gh api "$PR" --jq '.head.sha')" = "$EXPECTED_SHA"
          test "$(gh api "$PR" --jq '.base.ref')" = "test"
          test "$(gh api "$PR" --jq '.head.repo.full_name')" = "$GITHUB_REPOSITORY"
          test "$(gh api "$PR" --jq '.draft')" = "false"
          printf 'QA checks and emulator succeeded for %s\n' "$EXPECTED_SHA"
          gh api --method PUT "$PR/merge" -f sha="$EXPECTED_SHA" -f merge_method=squash --jq '.merged' | grep -x true
      - name: Dispatch signed Test release after validated merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN merges do not trigger ordinary push workflows; workflow_dispatch does.
          gh workflow run build-test.yml --repo "$GITHUB_REPOSITORY" --ref test
          echo "Signed Test workflow dispatched. Test release publishes only after its own emulator/signature checks."

  qa-failure-report:
    name: Report QA failure automatically
    needs: [checks, emulator, promote]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Store failing step and logs link in a GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          set -euo pipefail
          issue_title="[AudioBook QA] Автоматический отчёт PR #$PR_NUMBER"
          run_link="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title             --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)"
          if [[ "$CHECKS_RESULT" == success && "$EMULATOR_RESULT" == success && "$PROMOTE_RESULT" == success ]]; then
            echo "All QA stages passed: $run_link" >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "Устранено: все этапы QA завершены успешно. $run_link"
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi
          failing_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"             --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled") | "- **\(.name)**: \(.conclusion). Ошибочный шаг: \([.steps[]? | select(.conclusion=="failure" or .conclusion=="timed_out") | .name] | join(", ")). [Лог](\(.html_url))"' || true)"
          if [[ -z "$failing_jobs" ]]; then failing_jobs="Ошибочный шаг не определён автоматически; см. ссылку на запуск."; fi
          report="$(mktemp)"
          cat > "$report" <<EOF
          Обнаружена ошибка в QA-конвейере AudioBook, PR #$PR_NUMBER.

          - Коммит: $GITHUB_SHA
          - Прогон: $run_link
          - Компиляция и unit-тесты: **$CHECKS_RESULT**
          - Android-эмулятор: **$EMULATOR_RESULT**
          - Перенос в Test: **$PROMOTE_RESULT**

          **Остановившиеся задания и шаги**

          $failing_jobs

          Диагностика и результаты Android-тестов доступны в разделе Artifacts указанного прогона.
          При настоящей ошибке кода исправить причину и повторить тесты.
          Ни Test APK, ни основную версию нельзя считать выпущенными без успешной проверки.
          EOF
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body-file "$report"
          fi
