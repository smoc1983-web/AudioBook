name: Audiobook Test - signed release and in-app updates
on:
  push:
    branches: ['test']
    paths:
      - 'app/**'
      - 'current/**'
      - 'scripts/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: audiobook-test-release
  cancel-in-progress: true
jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Recover original signing identity - never generate a new key
        env:
          ORIGINAL_KEY: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/audiobook-preview-signing"
          echo "PREVIEW_KEYSTORE=$RUNNER_TEMP/audiobook-preview-signing/preview.keystore" >> "$GITHUB_ENV"
          if [ -n "$ORIGINAL_KEY" ]; then
            printf '%s' "$ORIGINAL_KEY" | base64 --decode > "$RUNNER_TEMP/audiobook-preview-signing/preview.keystore"
            chmod 600 "$RUNNER_TEMP/audiobook-preview-signing/preview.keystore"
          fi
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Verify signing identity is available
        run: test -s "$PREVIEW_KEYSTORE"
      - name: Reserve the next independent test version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          releases=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases?per_page=100"],text=True))
          codes=[int(t[6:]) for r in releases if (t:=r["tag_name"]).startswith("test-v") and t[6:].isdigit() and not r["draft"]]
          latest=max(codes,default=100100)
          assert latest>=100100 and latest<1099999
          next_code=latest+1
          next_number=next_code-100000
          tag=f"test-v{next_code}"
          assert not any(r["tag_name"]==tag for r in releases), "Version tag already exists"
          with open(os.environ["GITHUB_ENV"],"a") as out:
            out.write(f"TEST_NUMBER={next_number}\nTEST_CODE={next_code}\nTEST_TAG={tag}\n")
            out.write(f"TEST_BASE_TAG={f'test-v{latest}' if codes else ''}\n")
          print("Reserved",tag,"base",latest if codes else "none")
          PY
      - name: Validate source parsers
        run: |
          python3 current/check.py
          node current/tests/test-additional-sources.cjs
          node current/tests/test-nova-sources.cjs
      - name: Compress decorative backgrounds before packaging
        run: |
          python3 -m venv "$RUNNER_TEMP/audiobook-image-tools"
          "$RUNNER_TEMP/audiobook-image-tools/bin/pip" install --disable-pip-version-check Pillow==11.3.0
          "$RUNNER_TEMP/audiobook-image-tools/bin/python" scripts/optimize-test-resources.py
      - name: Build signed isolated Test APK and run checks
        run: |
          GITHUB_RUN_NUMBER="$TEST_NUMBER" gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease -PaudiobookChannel=test --max-workers=2 --console=plain
          python3 scripts/check-android-lint.py app/build/reports/lint-results-release.xml
          python3 scripts/package-test-release.py
      - name: Confirm previous Test APK can be replaced without signer rotation
        if: env.TEST_BASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-test
          gh release download "$TEST_BASE_TAG" --repo "$GITHUB_REPOSITORY" --dir prior-test --pattern 'Audiobook-Test.apk'
          OLD_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs prior-test/Audiobook-Test.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          NEW_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist-test/Audiobook-Test.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$OLD_CERT" && test "$OLD_CERT" = "$NEW_CERT"
          test "$NEW_CERT" = "3a4cecd14bb3e983843871766909c3f07b3dc64379800f3e270e4a27d39affb7"
          python3 - <<'PY'
          from pathlib import Path
          old=Path("prior-test/Audiobook-Test.apk").stat().st_size
          new=Path("dist-test/Audiobook-Test.apk").stat().st_size
          print(f"APK size: {old:,} -> {new:,} bytes ({(new-old)/old:+.1%})")
          PY
      - name: Enable KVM access for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify functional regressions and signed upgrade in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            GITHUB_RUN_NUMBER="$TEST_NUMBER" gradle :app:connectedDebugAndroidTest -PaudiobookChannel=test -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.CollectionTransferTest,com.audiobookdownloader.NovaListeningFeaturesTest,com.audiobookdownloader.SearchScrollTest,com.audiobookdownloader.SearchFiltersTest,com.audiobookdownloader.RankedAudioSearchTest,com.audiobookdownloader.UpdateScreenTest,com.audiobookdownloader.LatestMenuRegressionTest,com.audiobookdownloader.LibraryExperienceTest,com.audiobookdownloader.OfficialSeriesTest,com.audiobookdownloader.EditionDownloadTest,com.audiobookdownloader.MiniPlayerSwipeTest,com.audiobookdownloader.CycleSubscriptionsNavigationTest --max-workers=2 --console=plain
            if adb shell pm path com.audiobookdownloader.test | grep -q "^package:"; then adb uninstall com.audiobookdownloader.test; fi
            bash scripts/test-test-install.sh
      - name: Publish only verified Test channel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist-test/Audiobook-Test.apk
          test -s dist-test/test-update.json
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace an existing test release" >&2
            exit 1
          fi
          gh release create "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Audiobook Test 4.2.$TEST_NUMBER" --notes-file dist-test/release-notes.md
          gh release upload "$TEST_TAG" dist-test/Audiobook-Test.apk dist-test/test-update.json --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          tag=os.environ["TEST_TAG"]
          repo=os.environ["GITHUB_REPOSITORY"]
          root=Path("dist-test")
          names=("Audiobook-Test.apk","test-update.json")
          expected={name:("sha256:"+hashlib.sha256((root/name).read_bytes()).hexdigest()) for name in names}
          for attempt in range(10):
            # Draft releases cannot be fetched from /releases/tags/{tag};
            # the authenticated releases listing includes them.
            releases=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases?per_page=100"],text=True))
            matches=[r for r in releases if r["tag_name"]==tag]
            assert len(matches)<=1,"Ambiguous test release"
            release=matches[0] if matches else None
            if release:
              assets={a["name"]:a.get("digest") for a in release["assets"] if a["state"]=="uploaded"}
              if release["draft"] and release["prerelease"] and release["target_commitish"]==os.environ["GITHUB_SHA"] and assets==expected:
                (root/"release-id.txt").write_text(str(release["id"]))
                print("Verified draft release and all original SHA256 digests",tag)
                break
            time.sleep(3)
          else:
            raise RuntimeError("Draft release assets were not fully verified; refusing publication")
          PY
          RELEASE_ID="$(cat dist-test/release-id.txt)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')" = false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Audiobook-Test-checks
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            dist-test/test-update.json
          if-no-files-found: warn
          retention-days: 14
