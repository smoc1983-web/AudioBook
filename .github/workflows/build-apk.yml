name: Inspect screenshot audiobook sources
on:
  push:
    branches: [integration/screenshot-source-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python scripts/inspect-screenshot-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-source-evidence
          path: screenshot-source-evidence/
