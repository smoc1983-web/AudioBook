name: Build Audiobook APK
on:
  push:
    branches: [integration/verified-sources]
    paths-ignore: ['docs/**', 'README.md', 'FILES.json']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LIVE_SOURCES: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Audio decoder for source acceptance
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-debug
          overwrite: true
          path: app/build/outputs/apk/debug/*.apk
      - name: Save source verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-reports
          overwrite: true
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
