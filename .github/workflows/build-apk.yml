name: AudioBook main - verify only
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'current/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiobook-main-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Parser tests
        run: |
          python3 current/check.py
          node current/tests/test-additional-sources.cjs
          node current/tests/test-nova-sources.cjs
      - name: Compile, unit tests and Android lint (NO RELEASE)
        run: |
          GITHUB_RUN_NUMBER=101 gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:lintDebug -PaudiobookChannel=main --max-workers=2 --console=plain
          python3 scripts/check-android-lint.py app/build/reports/lint-results-debug.xml
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-main-test-reports
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
