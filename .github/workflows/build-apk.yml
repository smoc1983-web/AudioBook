name: Build Audiobook APK
on:
  push:
    branches: [main, integration/verified-sources]
    paths-ignore: ['docs/**', 'README.md', 'FILES.json']
  workflow_dispatch:
concurrency:
  group: audiobook-preview-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_SOURCES: "1"
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing workspace
        run: echo "PREVIEW_KEYSTORE=$RUNNER_TEMP/audiobook-preview-signing/preview.keystore" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Preserve Preview signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: bash scripts/preview-signing.sh
      - name: Private signing recovery backup (never shipped to the app)
        uses: actions/upload-artifact@v4
        with:
          name: preview-signing-recovery
          retention-days: 90
          path: ${{ env.PREVIEW_KEYSTORE }}
      - name: Audio decoder for source acceptance
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Tests and isolated Preview APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Package verified update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/preview-release.py
      - name: Publish private in-app update channel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat dist/tag.txt)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Audiobook Preview $tag" --notes "Отдельное приложение com.audiobookdownloader.preview. Установка параллельно стабильной версии. Обновление доступно в настройках Preview."
          fi
          gh release upload "$tag" dist/Audiobook-Preview.apk dist/preview-update.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Preview
          overwrite: true
          path: |
            dist/Audiobook-Preview.apk
            dist/preview-update.json
      - name: Save source verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-reports
          overwrite: true
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
