name: Verify and package Stage 8 phone candidate
on:
  push:
    branches: ['cloud/stage8-phone-candidate-20261118']
    paths: ['.github/workflows/stage8-phone-candidate.yml', 'app/src/androidTest/**', 'app/src/main/assets/release-notes.json']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_CANDIDATE_NUMBER: '96'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Restore existing Preview signer only, never create a key
        env:
          ORIGINAL_KEY: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'audiobook-preview-signing/preview.keystore'
          if os.environ.get('ORIGINAL_KEY'):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(os.environ['ORIGINAL_KEY'],validate=True))
              path.chmod(0o600)
          if not path.is_file(): raise SystemExit('Original signing key unavailable; refusing to generate a replacement')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('PREVIEW_KEYSTORE='+str(path)+'\n')
          PY
      - name: Fetch verified Preview 4.2.95 baseline and check candidate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code origin refs/tags/preview-v100095
          if git ls-remote --exit-code origin refs/tags/preview-v100096; then
            echo 'Preview 4.2.96 already has a tag. Choose a new candidate number.'
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/fetch-upgrade-baseline.py
          python3 -c "import json; assert json.load(open('upgrade-baseline/preview-update.json'))['versionCode'] == 100095"
      - name: Build signed Preview Release and the standalone upgrade probe
        run: GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" gradle :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease :upgradeProbe:assembleDebug --max-workers=2 --console=plain
      - name: Enable emulator access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual upgrade over Preview 4.2.95
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/test-preview-upgrade.py
      - name: Verify signed candidate and record its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/preview-release.py
          mv dist/Audiobook-Preview.apk dist/Audiobook-Preview-4.2.96.apk
          (cd dist && sha256sum Audiobook-Preview-4.2.96.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Preview-4.2.96-phone-test
          path: |
            dist/Audiobook-Preview-4.2.96.apk
            dist/SHA256SUMS
            dist/permission-audit.json
            startup-evidence/installed-upgrade.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8-upgrade-verification
          path: |
            startup-evidence/seedInstalledUpgradeData.txt
            startup-evidence/oldUpdaterAcceptsNewSignedApk.txt
            startup-evidence/installedUpgradeKeepsDataAndNewName.txt
            app/build/test-results/
            app/build/reports/
