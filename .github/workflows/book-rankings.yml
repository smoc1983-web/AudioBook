name: Verify book rankings
on:
  push:
    branches: ['cloud/book-rankings-20261121']
    paths: ['.github/workflows/book-rankings.yml', 'current/**', 'app/**', 'build.gradle.kts', 'gradle.properties']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Source parser checks
        run: |
          python -m pip install Pillow
          python tools/run_checks.py
      - name: Compile and test unsigned Stable without release publication
        run: gradle -PaudiobookChannel=stable :app:testDebugUnitTest :app:testReleaseUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease :app:auditRuntimeDependencies :legacyFixture:compileDebugSources --max-workers=2 --console=plain
      - name: Compile Preview
        run: gradle :app:assembleDebug --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ranking-reports
          path: |
            app/build/test-results/
            app/build/reports/
