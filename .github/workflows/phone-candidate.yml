name: Build phone APK only — audited 4.2.69
on:
  push:
    branches: ['delivery/audit69-phone']
    paths: ['.github/workflows/phone-candidate.yml']
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Signing workspace
        run: echo "PREVIEW_KEYSTORE=$RUNNER_TEMP/audiobook-preview-signing/preview.keystore" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Reuse installed signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: bash scripts/preview-signing.sh
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Assemble signed phone candidate; no tests or feed publication
        run: |
          GITHUB_RUN_NUMBER=69 gradle :app:assembleRelease --stacktrace
          mkdir -p phone-apk
          cp app/build/outputs/apk/release/app-release.apk phone-apk/Audiobook-4.2.69.apk
          split -b 24000000 -d phone-apk/Audiobook-4.2.69.apk phone-apk/candidate.part-
      - uses: actions/upload-artifact@v4
        with:
          name: phone-apk-part-00
          path: phone-apk/candidate.part-00
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: phone-apk-part-01
          path: phone-apk/candidate.part-01
          retention-days: 7

