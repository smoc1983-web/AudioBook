name: Finalize verified Audiobook Test 4.2.101 draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-staged-test101.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: '455809908'
      ORIGINAL_COMMIT: 'b5f9cc44a8b85fd3d270069ec06e6bbb31735081'
      EXPECTED_CERT: '3a4cecd14bb3e983843871766909c3f07b3dc64379800f3e270e4a27d39affb7'
    steps:
      - name: Android APK verifier
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Download staged assets using immutable asset IDs
        run: |
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/784031840" > Audiobook-Test.apk
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/784031837" > test-update.json
          test -s Audiobook-Test.apk
          test -s test-update.json
      - name: Independently verify release, files, APK package and certificate
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]
          rid=os.environ["RELEASE_ID"]
          release=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases/{rid}"],text=True))
          assert release["draft"] and release["prerelease"]
          assert release["tag_name"]=="test-v100101" and release["target_commitish"]==os.environ["ORIGINAL_COMMIT"]
          names=["Audiobook-Test.apk","test-update.json"]
          assets={a["name"]:a for a in release["assets"]}
          assert set(assets)==set(names)
          for name in names:
            p=Path(name)
            a=assets[name]
            assert a["state"]=="uploaded" and a["size"]==p.stat().st_size
            assert a["digest"]=="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest()
          data=json.loads(Path("test-update.json").read_text())
          apk=Path("Audiobook-Test.apk")
          expected={
            "packageName":"com.audiobookdownloader.test",
            "versionCode":100101,
            "versionName":"4.2.101",
            "apk":"Audiobook-Test.apk",
            "size":apk.stat().st_size,
            "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "certificateSha256":os.environ["EXPECTED_CERT"],
            "commit":os.environ["ORIGINAL_COMMIT"],
          }
          assert all(data.get(k)==v for k,v in expected.items())
          assert isinstance(data.get("changes"),list) and data["changes"]
          assert "parts" not in data
          tools=Path(os.environ["ANDROID_HOME"])/"build-tools/35.0.0"
          badging=subprocess.check_output([str(tools/"aapt"),"dump","badging",str(apk)],text=True)
          assert "package: name='com.audiobookdownloader.test' versionCode='100101' versionName='4.2.101'" in badging
          assert "application-label:'Audiobook Test'" in badging
          assert "application-debuggable" not in badging
          signed=subprocess.check_output([str(tools/"apksigner"),"verify","--verbose","--print-certs",str(apk)],text=True)
          assert "Signer #1 certificate SHA-256 digest: "+os.environ["EXPECTED_CERT"] in signed
          assert "Verified using v2 scheme (APK Signature Scheme v2): true" in signed
          print("Verified immutable Test 4.2.101 assets, identity, digests and APK signature")
          PY
      - name: Make verified Test release public without overwriting any assets
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false --jq '{tag_name,draft,prerelease}'
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '{tag_name,draft,prerelease}'
