name: Verify and package Book Binding Preview 4.2.97
on:
  push:
    branches: ['cloud/book-binding-phone-candidate-20261118']
    paths: ['.github/workflows/book-binding-phone-candidate.yml', 'scripts/test-preview-upgrade.py', 'scripts/test-book-binding-upgrades.sh', 'app/src/main/assets/release-notes.json']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_CANDIDATE_NUMBER: '97'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Restore existing Preview signer only, never create a key
        env:
          ORIGINAL_KEY: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'audiobook-preview-signing/preview.keystore'
          if os.environ.get('ORIGINAL_KEY'):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(os.environ['ORIGINAL_KEY'],validate=True))
              path.chmod(0o600)
          if not path.is_file(): raise SystemExit('Original signing key unavailable; refusing to generate a replacement')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('PREVIEW_KEYSTORE='+str(path)+'\n')
          PY
      - name: Fetch verified Preview 4.2.95 baseline and check candidate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code origin refs/tags/preview-v100095
          if git ls-remote --exit-code origin refs/tags/preview-v100097; then
            echo 'Preview 4.2.97 already has a tag. Choose a new candidate number.'
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/fetch-upgrade-baseline.py
          python3 -c "import json; assert json.load(open('upgrade-baseline/preview-update.json'))['versionCode'] == 100095"
      - name: Fetch and verify the earlier signed 4.2.96 phone candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44287342156 --repo "$GITHUB_REPOSITORY" --name Audiobook-Preview-4.2.96-phone-test --dir previous-phone-build
          mkdir -p upgrade-baseline-96
          cp previous-phone-build/dist/Audiobook-Preview-4.2.96.apk upgrade-baseline-96/Audiobook-Preview.apk
          echo 'd790f671cb8c3333e257a6abcafdb07ff8abd5635eb3d04c90d745e4b4cf8f6a  upgrade-baseline-96/Audiobook-Preview.apk' | sha256sum -c -
          python3 - <<'PYCODE'
          import json, os, pathlib, re, subprocess
          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/35.0.0"
          apk = pathlib.Path("upgrade-baseline-96/Audiobook-Preview.apk")
          badging = subprocess.check_output([str(tools / "aapt"), "dump", "badging", str(apk)], text=True)
          assert re.search(r"package: name='com\.audiobookdownloader\.preview' versionCode='100096' versionName='4\.2\.96'", badging)
          apk.with_name("preview-update.json").write_text(json.dumps({"versionCode": 100096}))
          PYCODE
      - name: Build signed Preview Release and the standalone upgrade probe
        run: GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" gradle :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease :upgradeProbe:assembleDebug --max-workers=2 --console=plain
      - name: Enable emulator access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual upgrade over Preview 4.2.95 and 4.2.96
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: bash scripts/test-book-binding-upgrades.sh
      - name: Verify signed candidate and record its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_RUN_NUMBER="$PREVIEW_CANDIDATE_NUMBER" python3 scripts/preview-release.py
          mv dist/Audiobook-Preview.apk dist/Audiobook-Preview-4.2.97.apk
          (cd dist && sha256sum Audiobook-Preview-4.2.97.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Preview-4.2.97-phone-test
          path: |
            dist/Audiobook-Preview-4.2.97.apk
            dist/SHA256SUMS
            dist/permission-audit.json
            startup-evidence/upgrade-95/installed-upgrade.json
            startup-evidence/upgrade-96/installed-upgrade.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-binding-upgrade-verification
          path: |
            startup-evidence/upgrade-95/*.txt
            startup-evidence/upgrade-96/*.txt
            app/build/test-results/
            app/build/reports/
