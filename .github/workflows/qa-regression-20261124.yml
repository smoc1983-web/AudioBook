name: AudioBook regression QA (no publication)
on:
  push:
    branches: ['qa/regression-20261124']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GITHUB_RUN_NUMBER_OVERRIDE: '124'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: JVM regressions and imported legacy title cases
        run: GITHUB_RUN_NUMBER=124 gradle :app:testDebugUnitTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: Build instrumented QA APK
        run: GITHUB_RUN_NUMBER=124 gradle :app:assembleDebug :app:assembleDebugAndroidTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 36 functional regression checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: GITHUB_RUN_NUMBER=124 gradle :app:connectedDebugAndroidTest -PaudiobookChannel=test -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.CollectionTransferTest,com.audiobookdownloader.NovaListeningFeaturesTest,com.audiobookdownloader.SearchScrollTest,com.audiobookdownloader.SearchFiltersTest,com.audiobookdownloader.RankedAudioSearchTest,com.audiobookdownloader.UpdateScreenTest,com.audiobookdownloader.LatestMenuRegressionTest,com.audiobookdownloader.LibraryExperienceTest,com.audiobookdownloader.OfficialSeriesTest,com.audiobookdownloader.EditionDownloadTest,com.audiobookdownloader.MiniPlayerSwipeTest,com.audiobookdownloader.SourceHealthPanelTest,com.audiobookdownloader.SourceHealthAndroidTest --max-workers=2 --console=plain
      - name: Live source health and permitted whole-book download
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            set +e
            GITHUB_RUN_NUMBER=124 gradle :app:connectedDebugAndroidTest -PaudiobookChannel=test -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.LivePermittedAudioTest --max-workers=2 --console=plain
            result=$?
            adb logcat -d -s AudioBookLiveQA:I '*:S' | tee live-source-audit.txt
            exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audiobook-regression-reports
          path: |
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/
            live-source-audit.txt
