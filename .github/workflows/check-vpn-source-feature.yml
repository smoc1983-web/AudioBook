name: Verify source VPN comparison in AudioBook Test (no release)
on:
  push:
    branches: ['feature/test-search-series-completeness-20261123']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-vpn-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Test parser and source checks
        run: |
          python3 current/check.py
          node current/tests/test-additional-sources.cjs
          node current/tests/test-nova-sources.cjs
      - name: Compile Android Test channel and verify VPN evidence rules
        run: |
          GITHUB_RUN_NUMBER=103 gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease -PaudiobookChannel=test --max-workers=2 --console=plain
          python3 scripts/check-android-lint.py app/build/reports/lint-results-release.xml
      - name: Save isolated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-vpn-source-regressions
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
