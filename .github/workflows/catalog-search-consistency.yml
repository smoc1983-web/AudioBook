name: Search catalogue consistency QA
on:
  push:
    branches: ['qa/catalog-search-consistency']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: restore
            classes: com.audiobookdownloader.RestoredCycleEvidenceTest,com.audiobookdownloader.AbCatalogIndexTest
          - mode: all
            classes: com.audiobookdownloader.FayrollSourceMatrixTest
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_RUN_NUMBER_OVERRIDE: '124'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: JVM regressions and imported legacy title cases
        run: GITHUB_RUN_NUMBER=124 gradle :app:testDebugUnitTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: Build instrumented QA APK
        run: GITHUB_RUN_NUMBER=124 gradle :app:assembleDebug :app:assembleDebugAndroidTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: Stop Gradle before launching the emulator
        run: gradle --stop
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: bash scripts/run-fayroll-matrix-case.sh "${{ matrix.mode }}" "Архил...?" "${{ matrix.classes }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-${{ matrix.mode }}
          path: |
            matrix-${{ matrix.mode }}.txt
            instrumentation-${{ matrix.mode }}-*.txt
            crash-${{ matrix.mode }}.txt
