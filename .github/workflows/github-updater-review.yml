name: GitHub updater review — no publication
on:
  push:
    branches: ['cloud/recovery-github-updater-20261104']
    paths-ignore: ['docs/**']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: [preview, stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Restore existing Preview signer only, never create a key
        env:
          ORIGINAL_KEY: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'audiobook-preview-signing/preview.keystore'
          if os.environ.get('ORIGINAL_KEY'):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(os.environ['ORIGINAL_KEY'],validate=True))
              path.chmod(0o600)
          if not path.is_file(): raise SystemExit('Original signing key unavailable; refusing to generate a replacement')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('PREVIEW_KEYSTORE='+str(path)+'\n')
          PY
      - name: All unit tests, Debug and Release, Android lint
        env:
          GITHUB_RUN_NUMBER: '90'
        run: gradle :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease -PaudiobookChannel=${{ matrix.channel }} --continue --stacktrace
      - name: Compile Android tests
        if: always() && matrix.channel == 'preview'
        env:
          GITHUB_RUN_NUMBER: '90'
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Emulator access
        if: success() && matrix.channel == 'preview'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: success() && matrix.channel == 'preview'
        env:
          GITHUB_RUN_NUMBER: '90'
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.UpdateScreenTest,com.audiobookdownloader.InstallerLaunchTest,com.audiobookdownloader.GitHubUpdateFlowTest --stacktrace
      - name: Prepare signed 4.2.93 bridge candidate — never publish
        if: success() && matrix.channel == 'preview'
        env:
          GITHUB_RUN_NUMBER: '93'
        run: |
          python3 scripts/test-update-bridge.py
          python3 - <<'PY'
          import subprocess,re
          refs=subprocess.check_output(['git','ls-remote','--tags','https://github.com/smoc1983-web/AudioBook.git'],text=True)
          codes=[int(m[1]) for m in re.finditer(r'refs/tags/preview-v([1-9][0-9]*)$',refs,re.M)]
          if max(codes,default=0)>=100093: raise SystemExit('Candidate 100093 is no longer free; do not replace a tag or release')
          PY
          GITHUB_RUN_NUMBER=93 gradle --no-daemon --no-configuration-cache :app:assembleRelease --stacktrace
          python3 tools/prepare-update-bridge.py --apk app/build/outputs/apk/release/app-release.apk --output bridge-candidate --build-tools "$ANDROID_HOME/build-tools/35.0.0" --minimum-installed-code 100092
          python3 - <<'PY'
          import zipfile
          text='Здесь можно проверить, скачать и установить обновление Audiobook. Удалять приложение перед обновлением не нужно.'.encode()
          with zipfile.ZipFile('bridge-candidate/github/Audiobook-Preview.apk') as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
          assert text in dex,'Selected screen copy missing from shipped APK'
          assert 'Это отдельное приложение.'.encode() not in dex,'Retired copy remains in shipped code'
          PY
      - name: Retain candidate APK for review only
        if: success() && matrix.channel == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-candidate-100093-github
          path: |
            bridge-candidate/github/
            bridge-candidate/bridge-check.json
      - name: Retain legacy feed and parts for review only
        if: success() && matrix.channel == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: bridge-candidate-100093-legacy-site
          path: bridge-candidate/legacy-site/
      - name: Reports only — no APK publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-review-${{ matrix.channel }}
          path: |
            app/build/test-results/
            app/build/reports/
            app/build/outputs/androidTest-results/
