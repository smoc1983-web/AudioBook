name: Compare browser and Audiobook series playback
on:
  push:
    branches: ['qa/fayroll-source-matrix']
    paths:
      - '.github/workflows/browser-app-series.yml'
      - 'scripts/audit-series-browser.cjs'
      - 'scripts/compare-browser-app-series.py'
      - 'app/src/main/java/com/audiobookdownloader/OfficialCycleSearch.kt'
      - 'app/src/main/java/com/audiobookdownloader/OpenedBookIdentity.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Search sites and stream chapter two in Chromium
        run: node scripts/audit-series-browser.cjs | tee browser-series.jsonl
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-series
          path: browser-series.jsonl
  application:
    needs: browser
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: fayroll, query: "Файролл"}
          - {slug: arhil, query: "Архил"}
          - {slug: builder, query: "Путь строителя"}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_RUN_NUMBER_OVERRIDE: '124'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: JVM regressions and imported legacy title cases
        run: GITHUB_RUN_NUMBER=124 gradle :app:testDebugUnitTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: Build instrumented QA APK
        run: GITHUB_RUN_NUMBER=124 gradle :app:assembleDebug :app:assembleDebugAndroidTest -PaudiobookChannel=test --max-workers=2 --console=plain
      - name: Stop Gradle before launching the emulator
        run: gradle --stop
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: bash scripts/run-fayroll-matrix-case.sh all "${{ matrix.query }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ matrix.slug }}
          path: |
            matrix-all.txt
            instrumentation-all-*.txt
            crash-all.txt
  compare:
    if: ${{ !cancelled() }}
    needs: [browser, application]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Compare browser and app results
        run: python3 scripts/compare-browser-app-series.py reports
