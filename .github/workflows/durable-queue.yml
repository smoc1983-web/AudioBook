name: Verify durable download queue
on:
  push:
    branches: ['cloud/durable-queue-20261116']
    paths: ['.github/workflows/durable-queue.yml', 'current/**', 'app/**', 'tools/tests/queue*']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Source parser checks
        run: |
          python -m pip install Pillow
          python tools/run_checks.py
      - name: Compile and test unsigned Stable without release publication
        run: gradle -PaudiobookChannel=stable :app:testDebugUnitTest :app:testReleaseUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-queue-reports
          path: |
            app/build/test-results/
            app/build/reports/
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audiobook-preview-signing
          key: audiobook-preview-signing-v1
      - name: Restore existing Preview signer only, never create a key
        env:
          ORIGINAL_KEY: ${{ secrets.AUDIOBOOK_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'audiobook-preview-signing/preview.keystore'
          if os.environ.get('ORIGINAL_KEY'):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(os.environ['ORIGINAL_KEY'],validate=True))
              path.chmod(0o600)
          if not path.is_file(): raise SystemExit('Original signing key unavailable; refusing to generate a replacement')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('PREVIEW_KEYSTORE='+str(path)+'\n')
          PY
      - name: Build Preview tests with the existing signer
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 --console=plain
      - name: Emulator access
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: success()
        env:
          GITHUB_RUN_NUMBER: '90'
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.audiobookdownloader.DownloadQueueStoreTest,com.audiobookdownloader.DurableQueueTest,com.audiobookdownloader.AudioValidationTest,com.audiobookdownloader.DownloadRetryTest,com.audiobookdownloader.LibraryExperienceTest#realAndroidDownloadSurvivesQueueReloadAndCancelPreservesFinishedFile --max-workers=2 --console=plain
            mkdir -p app/build/reports/stage3-native
            cp -R app/build/outputs/androidTest-results app/build/reports/stage3-native/normal
            bash tools/tests/queue-process-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-queue-native-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/
